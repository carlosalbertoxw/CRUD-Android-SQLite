name: Android CI

on:
  push:
    branches: [master]
  pull_request:

# El token de GitHub solo puede leer el repositorio.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Formato, pruebas unitarias, lint y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Descarga Gradle, valida el wrapper y guarda en caché dependencias y
      # resultados entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v6

      - name: Formato, pruebas unitarias, lint y compilación
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented:
    name: Pruebas instrumentadas (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # El emulador necesita aceleración por hardware (KVM) en el runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulador gestionado por Gradle (ver testOptions en app/build.gradle.kts):
      # DAO contra SQLite real, migraciones, pantallas y flujo completo de la app.
      - name: Pruebas instrumentadas
        run: >
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-instrumentadas
          path: app/build/outputs/androidTest-results/
