name: CodeQL

# Análisis estático de seguridad del código Kotlin. Los resultados aparecen en
# la pestaña "Security" del repositorio.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Cada lunes, por si aparecen reglas nuevas.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analizar (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL observa esta compilación para extraer el código Kotlin.
      - name: Compilar
        run: ./gradlew assembleDebug --no-build-cache --no-configuration-cache

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
